name: RaceDay CI

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore solution (MVC, API and tests)
        run: dotnet restore RaceDay.sln
      - name: Build complete solution
        run: dotnet build RaceDay.sln --configuration Release --no-restore
      - name: Run all tests
        run: dotnet test RaceDay.sln --configuration Release --no-build --logger "trx;LogFileName=raceday-tests.trx"
      - name: Build MVC Docker image
        run: docker build -t raceday-web:ci .
      - name: Build API Docker image
        run: docker build -f src/RaceDay.Api/Dockerfile -t raceday-api:ci .
